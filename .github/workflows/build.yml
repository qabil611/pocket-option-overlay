name: Build Android APK

on:
workflow_dispatch:
push:
paths:
- "android-project.zip"
- ".github/workflows/build.yml"

jobs:
build:
runs-on: ubuntu-latest

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Locate Android SDK Manager
    run: |
      SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
      if [ -z "$SDKMANAGER" ]; then
        echo "SDK Manager not found"
        exit 1
      fi
      echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

  - name: Install Android SDK packages
    run: |
      yes | "$SDKMANAGER" --licenses || true
      "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

  - name: Extract Android project
    run: |
      mkdir -p android-project
      unzip -q android-project.zip -d android-project
      ls -la android-project

  - name: Build APK
    working-directory: android-project
    run: |
      gradle assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: POCKET-OPTION-AI-APK
      path: android-project/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error