name: Build Android APK

on:
workflow_dispatch:
push:
paths:
- "android-project.zip"
- ".github/workflows/build.yml"

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Extract Android project
    run: |
      mkdir -p android-project
      unzip -q android-project.zip -d android-project
      echo "PROJECT FILES:"
      find android-project -maxdepth 4 -type f | head -100

  - name: Locate Gradle project
    run: |
      GRADLE_FILE=$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -1)
      if [ -z "$GRADLE_FILE" ]; then
        echo "ERROR: Gradle settings file not found!"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$GRADLE_FILE")
      echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      gradle assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: pocket-option-debug-apk
      path: android-project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error