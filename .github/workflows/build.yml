name: Build Android APK

on:
workflow_dispatch:
push:
paths:
- "android-project.zip"
- ".github/workflows/build.yml"

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Extract project
    run: |
      mkdir -p android-project
      unzip -q android-project.zip -d android-project
      ls -la android-project

  - name: Build APK
    working-directory: android-project
    run: |
      gradle assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: POCKET-OPTION-AI-APK
      path: android-project/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error